name: "Terraform Tag Compliance Check"

on:
  pull_request:
    branches:
      - pre-release
  push:
    branches:
      - pre-release

jobs:
  # Job 1: Find all environment directories containing *.tf files
  find-environments:
    name: "Discover Environments"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Locate Environment Directories
        id: set-matrix
        run: |
          # Finds directories under environments/ containing .tf files and formats as a JSON array
          ENV_DIRS=$(find environments -mindepth 1 -maxdepth 1 -type d -exec test -e "{}/main.tf" -o -name "*.tf" \; -print | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=${ENV_DIRS}" >> "$GITHUB_OUTPUT"

  # Job 2: Run Terraform plan and OPA evaluation for each environment in parallel
  opa-compliance:
    name: "OPA Check (${{ matrix.environment }})"
    needs: find-environments
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Allows all environments to run even if one fails
      matrix:
        environment: ${{ fromJson(needs:find-environments.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Open Policy Agent
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan.binary

      - name: Convert Plan to JSON
        run: terraform show -json tfplan.binary > tfplan.json

      - name: Run OPA Tag Evaluation
        run: |
          # Use $GITHUB_WORKSPACE to reference the shared policy file
          VIOLATIONS=$(opa eval --format raw --data "$GITHUB_WORKSPACE/policy/check_tags.rego" --input tfplan.json "data.terraform.tags.deny")

          if [ "$VIOLATIONS" != "[]" ] && [ -n "$VIOLATIONS" ]; then
            echo "::error::OPA policy violations found in ${{ matrix.environment }}:"
            echo "$VIOLATIONS" | jq -r '.[]'
            exit 1
          else
            echo "All resources in ${{ matrix.environment }} comply with the tagging policy."
          fi